plugins { id 'com.gtnewhorizons.gtnhconvention' }
ext.repositoryRoot = file('../..')
ext.minecraftTarget = '1.7.10'
ext.loaderTarget = 'forge'
ext.loaderVersion = '1.7.10-10.13.4.1614-1.7.10'
ext.javaTarget = 8
apply from: '../../build-logic/version.gradle'
apply from: '../../build-logic/shared.gradle'
repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    // Official pinned dev artifact: compile-time Mixin targets only, never a runtime dependency.
    ivy {
        name = 'PinnedCubicChunks'
        url = 'https://github.com/GTNewHorizons/CubicChunks1710/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision]-[classifier].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'com.cardinalstar', 'cubicchunks' }
    }
}
dependencies {
    compileOnly 'info.journeymap:journeymap-api-forge:1.7.10-2.0.0'
    devOnlyNonPublishable('com.github.GTNewHorizons:CodeChickenCore:1.4.16:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev')
    compileOnly('com.cardinalstar:cubicchunks:v0.1.23-alpha-pre:dev') { transitive = false }
}

apply from: '../../build-logic/devmods.gradle'
// Jabel compiler settings are owned by GTNH; shared sources still obey Java 8 APIs.
jar.finalizedBy 'reobfJar'
